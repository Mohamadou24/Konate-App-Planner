<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konate App Planner</title>
<style>
:root{--navy:#17324d;--blue:#246b8e;--pale:#f2f7fa;--line:#cfdae2;--text:#17212b;--ok:#2f6f4e}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--text);background:#eef3f6}header{position:sticky;top:0;z-index:5;background:var(--navy);color:white;padding:18px 24px;box-shadow:0 2px 10px #0003}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;font-size:13px;opacity:.85}.wrap{max-width:1100px;margin:22px auto;padding:0 18px 60px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:white;padding:14px;border-radius:14px;box-shadow:0 5px 22px #19324716;margin-bottom:16px}button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:white}button.alt{background:#e4edf2;color:var(--navy)}button.danger{background:#8b3a3a}.progress{flex:1;min-width:220px}.bar{height:10px;background:#dce5ea;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--ok)}#pct{font-size:12px;margin-top:5px}.section{background:white;border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;box-shadow:0 4px 18px #17324d0c}.section h2{margin:0;padding:16px 18px;background:var(--pale);color:var(--navy);font-size:17px;cursor:pointer}.content{padding:8px 18px 18px}label{display:block;font-weight:700;font-size:13px;margin:14px 0 7px}input,textarea{width:100%;border:1px solid #b8c7d1;border-radius:9px;padding:10px;font:inherit;background:white}textarea{min-height:100px;resize:vertical}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:white;padding:16px;border-radius:14px;border:1px solid var(--line)}.prompt{white-space:pre-wrap;background:#101820;color:#eaf4f8;padding:18px;border-radius:12px;font-size:13px;line-height:1.5}.status{font-size:12px;color:#4d6574}.submit-note{background:#fff8dd;border:1px solid #ead58b;padding:12px 14px;border-radius:10px;margin:0 0 16px;font-size:13px;line-height:1.45}@media(max-width:700px){.meta{grid-template-columns:1fr}header{position:static}}
@media print{header,.toolbar{display:none}body{background:white}.section{break-inside:avoid;box-shadow:none}}
</style></head><body><header><h1>Konate App Planner</h1><p>Answer the questions, save locally, and export a build-ready brief.</p></header><main class="wrap">
<div class="toolbar"><div class="progress"><div class="bar"><div class="fill" id="fill"></div></div><div id="pct">0% complete</div></div><button onclick="saveData()">Save Draft</button><button class="alt" onclick="exportJSON()">Export JSON</button><button class="alt" onclick="exportBrief()">Export Build Brief</button><button class="alt" onclick="window.print()">Print / PDF</button><button onclick="submitPlan()">Submit to Konate</button><button class="alt" onclick="emailFallback()">Email Copy</button><button class="danger" onclick="resetAll()">Reset</button><span class="status" id="status"></span></div>
<div class="submit-note"><strong>Submission setup:</strong> The owner must connect this page to a Formspree endpoint before direct submissions work. The Email Copy button remains available as a fallback.</div><div class="meta"><div><label>Prepared for</label><input id="preparedFor"></div><div><label>Project owner</label><input id="projectOwner"></div><div><label>Date / version</label><input id="dateVersion"></div></div>
<div id="form"></div><section class="section"><h2>Final AI Build Prompt</h2><div class="content"><div class="prompt" id="buildPrompt"></div></div></section></main>
<script>
const FORM_ENDPOINT='PASTE_YOUR_FORMSPREE_ENDPOINT_HERE';
const OWNER_EMAIL='PASTE_YOUR_EMAIL_HERE';
const sections=[{"title": "1. Project Foundation", "questions": [{"id": "s1q1", "label": "App or project name", "type": "text"}, {"id": "s1q2", "label": "Describe the app in one sentence", "type": "long"}, {"id": "s1q3", "label": "What problem does the app solve?", "type": "long"}, {"id": "s1q4", "label": "Who experiences this problem?", "type": "long"}, {"id": "s1q5", "label": "What is the primary outcome the app must deliver?", "type": "long"}, {"id": "s1q6", "label": "What type of app is it? (web, mobile, desktop, internal tool, marketplace, etc.)", "type": "text"}, {"id": "s1q7", "label": "What is included in version one?", "type": "long"}, {"id": "s1q8", "label": "What is explicitly out of scope for version one?", "type": "long"}]}, {"title": "2. Target Users and Roles", "questions": [{"id": "s2q1", "label": "Who are the primary users?", "type": "long"}, {"id": "s2q2", "label": "Who are the secondary users?", "type": "long"}, {"id": "s2q3", "label": "List every user role", "type": "long"}, {"id": "s2q4", "label": "What can each role view, create, edit, approve, delete, or export?", "type": "long"}, {"id": "s2q5", "label": "Are there age, location, membership, employment, or eligibility restrictions?", "type": "long"}, {"id": "s2q6", "label": "What accessibility or language needs should be supported?", "type": "long"}]}, {"title": "3. User Journey and Workflows", "questions": [{"id": "s3q1", "label": "Describe the first-time user journey from opening the app to completing the first valuable action", "type": "long"}, {"id": "s3q2", "label": "Describe the returning-user journey", "type": "long"}, {"id": "s3q3", "label": "What are the three most important tasks users must complete?", "type": "long"}, {"id": "s3q4", "label": "For each key task, list the exact steps, decisions, confirmations, and possible failures", "type": "long"}, {"id": "s3q5", "label": "What should happen when a task is abandoned or interrupted?", "type": "long"}]}, {"title": "4. Features and Priority", "questions": [{"id": "s4q1", "label": "Must-have features for launch", "type": "long"}, {"id": "s4q2", "label": "Should-have features", "type": "long"}, {"id": "s4q3", "label": "Nice-to-have features", "type": "long"}, {"id": "s4q4", "label": "Future features", "type": "long"}, {"id": "s4q5", "label": "For each must-have feature, describe who uses it, required inputs, expected output, permissions, and errors", "type": "long"}]}, {"title": "5. Screens, Navigation, and Layout", "questions": [{"id": "s5q1", "label": "List every public screen", "type": "long"}, {"id": "s5q2", "label": "List every signed-in user screen", "type": "long"}, {"id": "s5q3", "label": "List every staff or administrator screen", "type": "long"}, {"id": "s5q4", "label": "What is the primary navigation structure?", "type": "long"}, {"id": "s5q5", "label": "Which pages require authentication or a specific role?", "type": "long"}, {"id": "s5q6", "label": "What should each dashboard show first?", "type": "long"}, {"id": "s5q7", "label": "What should mobile navigation look like?", "type": "long"}]}, {"title": "6. Visual Design and Branding", "questions": [{"id": "s6q1", "label": "Describe the desired visual style using specific words", "type": "long"}, {"id": "s6q2", "label": "Primary, secondary, accent, background, and text colors", "type": "long"}, {"id": "s6q3", "label": "Preferred fonts or typography style", "type": "text"}, {"id": "s6q4", "label": "Button, card, icon, image, and animation preferences", "type": "long"}, {"id": "s6q5", "label": "Apps or websites to use as visual references, and what to borrow from each", "type": "long"}, {"id": "s6q6", "label": "Design elements, colors, or styles to avoid", "type": "long"}, {"id": "s6q7", "label": "Should the app support light mode, dark mode, or both?", "type": "text"}]}, {"title": "7. Accounts, Profiles, and Authentication", "questions": [{"id": "s7q1", "label": "How can users register and sign in?", "type": "long"}, {"id": "s7q2", "label": "What information is required during registration?", "type": "long"}, {"id": "s7q3", "label": "Is verification, approval, invitation, or identity checking required?", "type": "long"}, {"id": "s7q4", "label": "What can users edit on their profile?", "type": "long"}, {"id": "s7q5", "label": "What profile information is public, private, or role-restricted?", "type": "long"}, {"id": "s7q6", "label": "How do password reset, account recovery, account deletion, and data export work?", "type": "long"}, {"id": "s7q7", "label": "Is two-factor authentication required or optional?", "type": "text"}]}, {"title": "8. Forms, Data, and Validation", "questions": [{"id": "s8q1", "label": "List every form the app needs", "type": "long"}, {"id": "s8q2", "label": "For each form, list fields, field types, required fields, limits, and validation rules", "type": "long"}, {"id": "s8q3", "label": "What records or database objects must exist?", "type": "long"}, {"id": "s8q4", "label": "How are the records related?", "type": "long"}, {"id": "s8q5", "label": "Who can create, view, edit, archive, or delete each record?", "type": "long"}, {"id": "s8q6", "label": "What duplicate-prevention or data-quality rules are needed?", "type": "long"}]}, {"title": "9. Search, Filters, Sorting, and Discovery", "questions": [{"id": "s9q1", "label": "What can users search for?", "type": "long"}, {"id": "s9q2", "label": "What filters are required?", "type": "long"}, {"id": "s9q3", "label": "What sorting options are required?", "type": "long"}, {"id": "s9q4", "label": "Should search include autocomplete, typo tolerance, recent searches, or recommendations?", "type": "long"}, {"id": "s9q5", "label": "What should appear when there are no results?", "type": "long"}]}, {"title": "10. Content and File Management", "questions": [{"id": "s10q1", "label": "What content can be created, uploaded, published, scheduled, or archived?", "type": "long"}, {"id": "s10q2", "label": "Who can create, approve, edit, feature, reject, or remove content?", "type": "long"}, {"id": "s10q3", "label": "What file types, sizes, dimensions, or duration limits apply?", "type": "long"}, {"id": "s10q4", "label": "Should uploads include previews, progress, compression, replacement, or version history?", "type": "long"}, {"id": "s10q5", "label": "Where should media be stored and how should access be controlled?", "type": "long"}]}, {"title": "11. Payments, Subscriptions, or Transactions", "questions": [{"id": "s11q1", "label": "Does the app accept money or process transactions? Describe each transaction type", "type": "long"}, {"id": "s11q2", "label": "What products, plans, prices, fees, taxes, discounts, or trials exist?", "type": "long"}, {"id": "s11q3", "label": "Which payment provider should be used?", "type": "text"}, {"id": "s11q4", "label": "How do receipts, refunds, cancellations, disputes, failed payments, and renewals work?", "type": "long"}, {"id": "s11q5", "label": "Does the app pay vendors, creators, or service providers? Describe payout rules", "type": "long"}]}, {"title": "12. Scheduling, Location, and Communication", "questions": [{"id": "s12q1", "label": "Does the app include appointments, reservations, events, availability, or calendars?", "type": "long"}, {"id": "s12q2", "label": "Describe booking, cancellation, rescheduling, capacity, and reminder rules", "type": "long"}, {"id": "s12q3", "label": "Does the app use maps, addresses, current location, directions, delivery, or service areas?", "type": "long"}, {"id": "s12q4", "label": "Does the app include direct messages, group chat, comments, calls, or support chat?", "type": "long"}, {"id": "s12q5", "label": "Who may contact whom, and what blocking or reporting controls are required?", "type": "long"}]}, {"title": "13. Notifications and Automations", "questions": [{"id": "s13q1", "label": "List every event that should trigger an in-app, email, SMS, push, or browser notification", "type": "long"}, {"id": "s13q2", "label": "Can users control notification channels and frequency?", "type": "long"}, {"id": "s13q3", "label": "List automatic actions the system should perform", "type": "long"}, {"id": "s13q4", "label": "For each automation, define trigger, conditions, action, timing, retries, and failure handling", "type": "long"}]}, {"title": "14. Administration, Moderation, and Reporting", "questions": [{"id": "s14q1", "label": "What metrics should appear on the administrator dashboard?", "type": "long"}, {"id": "s14q2", "label": "What user-management actions should administrators have?", "type": "long"}, {"id": "s14q3", "label": "What content, transaction, configuration, and integration controls should administrators have?", "type": "long"}, {"id": "s14q4", "label": "What can users report, and how does the moderation workflow operate?", "type": "long"}, {"id": "s14q5", "label": "What audit logs and exportable reports are required?", "type": "long"}]}, {"title": "15. Integrations and AI Features", "questions": [{"id": "s15q1", "label": "List every external service or API the app must connect to", "type": "long"}, {"id": "s15q2", "label": "For each integration, describe information sent, information received, permissions, and failure behavior", "type": "long"}, {"id": "s15q3", "label": "What AI features should be included?", "type": "long"}, {"id": "s15q4", "label": "What information may the AI access, and what must remain private?", "type": "long"}, {"id": "s15q5", "label": "What should the AI refuse, label, verify, or escalate?", "type": "long"}, {"id": "s15q6", "label": "What happens when an AI or external service is unavailable?", "type": "long"}]}, {"title": "16. Security, Privacy, and Compliance", "questions": [{"id": "s16q1", "label": "What personal, financial, health, identity, location, or private information is stored?", "type": "long"}, {"id": "s16q2", "label": "Who may access sensitive information?", "type": "long"}, {"id": "s16q3", "label": "What retention, deletion, consent, and data-export rules apply?", "type": "long"}, {"id": "s16q4", "label": "What legal policies or industry rules apply?", "type": "long"}, {"id": "s16q5", "label": "What security controls are required?", "type": "long"}, {"id": "s16q6", "label": "What rate limits, session rules, audit logs, and suspicious-activity controls are needed?", "type": "long"}]}, {"title": "17. States, Errors, and Edge Cases", "questions": [{"id": "s17q1", "label": "Describe loading states for major screens and actions", "type": "long"}, {"id": "s17q2", "label": "Describe empty states for dashboards, searches, messages, orders, or content", "type": "long"}, {"id": "s17q3", "label": "Describe success confirmations for important actions", "type": "long"}, {"id": "s17q4", "label": "List likely errors and the exact user-friendly recovery behavior", "type": "long"}, {"id": "s17q5", "label": "What happens with slow internet, offline use, duplicate submissions, expired sessions, and unavailable services?", "type": "long"}]}, {"title": "18. Technical and Performance Requirements", "questions": [{"id": "s18q1", "label": "Preferred frontend, backend, database, hosting, and authentication technologies", "type": "long"}, {"id": "s18q2", "label": "Expected launch users, simultaneous users, storage volume, and growth", "type": "long"}, {"id": "s18q3", "label": "Performance targets for loading, search, uploads, and key actions", "type": "long"}, {"id": "s18q4", "label": "Which devices, browsers, screen sizes, and operating systems must be supported?", "type": "long"}, {"id": "s18q5", "label": "Are offline support, real-time updates, background jobs, or native device features required?", "type": "long"}]}, {"title": "19. Testing and Acceptance", "questions": [{"id": "s19q1", "label": "List test accounts and roles that should be created", "type": "long"}, {"id": "s19q2", "label": "What functional, permission, security, mobile, browser, accessibility, and integration tests are required?", "type": "long"}, {"id": "s19q3", "label": "Write clear acceptance criteria for each must-have feature", "type": "long"}, {"id": "s19q4", "label": "What exact conditions define version one as complete?", "type": "long"}, {"id": "s19q5", "label": "What known limitations are acceptable at launch?", "type": "long"}]}, {"title": "20. Delivery and AI Build Instructions", "questions": [{"id": "s20q1", "label": "What files, documentation, deployment steps, environment variables, and sample data must be delivered?", "type": "long"}, {"id": "s20q2", "label": "What should the coding AI never change without approval?", "type": "long"}, {"id": "s20q3", "label": "What assumptions should the coding AI surface before building?", "type": "long"}, {"id": "s20q4", "label": "How should incomplete integrations or placeholder data be labeled?", "type": "long"}, {"id": "s20q5", "label": "Who approves the final build?", "type": "text"}]}]; const promptText="Build a complete, responsive application from the completed planning questionnaire. Before coding, produce: (1) a concise requirements summary, (2) user roles and permission matrix, (3) feature-priority list, (4) screen and navigation map, (5) database schema, (6) integration plan, (7) implementation sequence, and (8) contradictions, assumptions, or missing dependencies. Do not silently invent requirements.\n\nDuring development, use reusable components, a clean folder structure, environment variables for secrets, server-side authorization, frontend and backend validation, accessible interfaces, responsive layouts, and clear loading, empty, success, and error states. Every visible button, menu item, form, and control must work. Do not create fake integrations or unlabeled mock data. Protect restricted data on the server, not only in the interface.\n\nAt completion, test every role and must-have workflow. Deliver setup instructions, deployment instructions, environment-variable requirements, database migrations, sample data, test accounts, a completed-feature checklist, known limitations, unfinished items, and recommended future improvements."; document.getElementById('buildPrompt').textContent=promptText;
const root=document.getElementById('form');
sections.forEach(s=>{const sec=document.createElement('section');sec.className='section';const h=document.createElement('h2');h.textContent=s.title;const content=document.createElement('div');content.className='content';h.onclick=()=>content.hidden=!content.hidden;s.questions.forEach(q=>{const l=document.createElement('label');l.htmlFor=q.id;l.textContent=q.label;const el=document.createElement(q.type==='long'?'textarea':'input');el.id=q.id;el.addEventListener('input',updateProgress);content.append(l,el)});sec.append(h,content);root.append(sec)});
const ids=['preparedFor','projectOwner','dateVersion',...sections.flatMap(s=>s.questions.map(q=>q.id))]; ids.slice(0,3).forEach(id=>document.getElementById(id).addEventListener('input',updateProgress));
function collect(){const out={meta:{},sections:[]};out.meta.preparedFor=value('preparedFor');out.meta.projectOwner=value('projectOwner');out.meta.dateVersion=value('dateVersion');sections.forEach(s=>out.sections.push({title:s.title,answers:s.questions.map(q=>({question:q.label,answer:value(q.id)}))}));out.buildPrompt=promptText;return out}
function value(id){return document.getElementById(id).value.trim()}
function saveData(){localStorage.setItem('konateAppPlanner',JSON.stringify(collect()));show('Draft saved on this device.')}
function loadData(){const raw=localStorage.getItem('konateAppPlanner');if(!raw)return;try{const d=JSON.parse(raw);document.getElementById('preparedFor').value=d.meta?.preparedFor||'';document.getElementById('projectOwner').value=d.meta?.projectOwner||'';document.getElementById('dateVersion').value=d.meta?.dateVersion||'';d.sections?.forEach((s,si)=>s.answers?.forEach((a,qi)=>{const q=sections[si]?.questions[qi];if(q)document.getElementById(q.id).value=a.answer||''}));show('Saved draft restored.')}catch(e){}}
function updateProgress(){const answered=ids.filter(id=>value(id)).length;const pct=Math.round(answered/ids.length*100);document.getElementById('fill').style.width=pct+'%';document.getElementById('pct').textContent=pct+'% complete ('+answered+' of '+ids.length+' fields)'}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportJSON(){download('Konate-App-Planner-Answers.json',JSON.stringify(collect(),null,2),'application/json')}
function exportBrief(){const d=collect();let t=`# AI APP DEVELOPMENT BRIEF

Prepared for: ${d.meta.preparedFor}
Project owner: ${d.meta.projectOwner}
Date / version: ${d.meta.dateVersion}

`;d.sections.forEach(s=>{t+=`## ${s.title}

`;s.answers.forEach(a=>{t+=`### ${a.question}
${a.answer||'[Not answered]'}

`})});t+=`## FINAL AI BUILD PROMPT

${promptText}
`;download('Konate-App-Build-Brief.md',t,'text/markdown')}

async function submitPlan(){
  if(FORM_ENDPOINT.includes('PASTE_YOUR')){alert('The owner has not connected the secure submission endpoint yet. Use Email Copy instead.');return}
  const btn=event?.target; if(btn){btn.disabled=true;btn.textContent='Submitting...'}
  try{
    const d=collect();
    const brief=buildBriefText(d);
    const response=await fetch(FORM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({subject:'New Konate App Planner Submission',prepared_for:d.meta.preparedFor,project_owner:d.meta.projectOwner,date_version:d.meta.dateVersion,completed_plan:brief})});
    if(!response.ok) throw new Error('Submission failed');
    show('Plan submitted successfully.'); alert('Your app plan was sent successfully.');
  }catch(e){alert('The plan could not be submitted. Please use Email Copy or export the build brief.');}
  finally{if(btn){btn.disabled=false;btn.textContent='Submit to Konate'}}
}
function buildBriefText(d){let t=`KONATE APP PLANNER - COMPLETED BRIEF

Prepared for: ${d.meta.preparedFor}
Project owner: ${d.meta.projectOwner}
Date / version: ${d.meta.dateVersion}

`;d.sections.forEach(s=>{t+=`${s.title}
${'='.repeat(s.title.length)}

`;s.answers.forEach(a=>{t+=`${a.question}
${a.answer||'[Not answered]'}

`})});t+=`FINAL AI BUILD PROMPT

${promptText}
`;return t}
function emailFallback(){
  if(OWNER_EMAIL.includes('PASTE_YOUR')){alert('The owner email has not been added yet. Export the build brief and attach it manually.');return}
  const d=collect(); const subject=encodeURIComponent('Completed Konate App Planner - '+(d.meta.preparedFor||d.meta.projectOwner||'New App Project'));
  const body=encodeURIComponent(buildBriefText(d).slice(0,18000));
  window.location.href=`mailto:${OWNER_EMAIL}?subject=${subject}&body=${body}`;
}

function resetAll(){if(confirm('Clear every answer and the saved draft?')){ids.forEach(id=>document.getElementById(id).value='');localStorage.removeItem('konateAppPlanner');updateProgress();show('Planner reset.')}}
function show(t){const s=document.getElementById('status');s.textContent=t;setTimeout(()=>s.textContent='',3000)}loadData();updateProgress();
</script></body></html>
